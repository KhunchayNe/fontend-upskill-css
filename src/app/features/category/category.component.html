<app-navbar></app-navbar>
<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">
  <h2 class="text-xl font-bold mb-4">🗂 จัดการหมวดหมู่</h2>

  <!-- Form -->
  <form (ngSubmit)="submitForm()" class="space-y-4">
    <div>
      <label for="categoryName" class="block text-sm font-medium text-gray-700">ชื่อหมวดหมู่:</label>
      <input type="text" [(ngModel)]="name" name="name" id="categoryName" required
             placeholder="กรุณากรอกชื่อหมวดหมู่" title="ชื่อหมวดหมู่"
             class="w-full px-4 py-2 border rounded-md mt-1" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">ประเภท:</label>
      <select [(ngModel)]="type" name="type" title="ประเภทหมวดหมู่"
              class="w-full px-4 py-2 border rounded-md mt-1">
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
    </div>

    <div class="flex space-x-2">
      <button type="submit"
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        {{ isEditing ? 'อัปเดต' : 'เพิ่ม' }}
      </button>
      <button type="button" (click)="clearForm()"
              class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">
        เคลียร์
      </button>
    </div>
  </form>

  <!-- List -->
  <div class="mt-8">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-500">ชื่อ</th>
          <th class="px-4 py-2 text-left text-sm font-medium text-gray-500">ประเภท</th>
          <th class="px-4 py-2 text-right text-sm font-medium text-gray-500">การจัดการ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories" class="border-b">
          <td class="px-4 py-2">{{ category.name }}</td>
          <td class="px-4 py-2">
            <span [ngClass]="{
              'text-green-600': category.type === 'income',
              'text-red-600': category.type === 'expense'
            }">{{ category.type === 'income' ? 'รายรับ' : 'รายจ่าย' }}</span>
          </td>
          <td class="px-4 py-2 text-right space-x-2">
            <button (click)="editCategory(category)"
                    class="text-blue-600 hover:underline">แก้ไข</button>
            <button (click)="deleteCategory(category.id)"
                    class="text-red-600 hover:underline">ลบ</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
