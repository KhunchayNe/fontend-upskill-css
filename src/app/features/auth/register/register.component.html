<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">สมัครสมาชิก</h2>

  <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="space-y-4">
    <div>
      <label for="firstname" class="block text-sm font-medium">ชื่อ:</label>
      <input type="text" [(ngModel)]="firstname" name="firstname" id="firstname" required
         placeholder="กรุณากรอกชื่อ" title="กรุณากรอกชื่อของคุณ"
         class="w-full px-4 py-2 border rounded" />
    </div>

    <div>
      <label for="lastname" class="block text-sm font-medium">นามสกุล:</label>
      <input type="text" [(ngModel)]="lastname" name="lastname" id="lastname" required
         placeholder="กรุณากรอกนามสกุล" title="กรุณากรอกนามสกุลของคุณ"
         class="w-full px-4 py-2 border rounded" />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium">อีเมล:</label>
      <input type="email" [(ngModel)]="email" name="email" id="email" required
             placeholder="กรุณากรอกอีเมล" title="กรุณากรอกอีเมลของคุณ"
             class="w-full px-4 py-2 border rounded" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium">รหัสผ่าน:</label>
      <input type="password" [(ngModel)]="password" name="password" id="password" required
             placeholder="กรุณากรอกรหัสผ่าน" title="กรุณากรอกรหัสผ่านของคุณ"
             class="w-full px-4 py-2 border rounded" />
    </div>

    <button
      type="submit"
      [disabled]="loading || !registerForm.form.valid"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
    >
      {{ loading ? 'กำลังสมัคร...' : 'สมัครสมาชิก' }}
    </button>

    <div *ngIf="error" class="text-red-500 text-center">{{ error }}</div>

    <div class="text-sm text-center text-gray-500 mt-4">
      มีบัญชีแล้ว? <a routerLink="/login" class="text-blue-600 hover:underline">เข้าสู่ระบบ</a>
    </div>
  </form>
</div>
