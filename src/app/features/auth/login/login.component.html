<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">Login</h2>

  <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-4">
    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        id="email"
        placeholder="Enter your email"
        required
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        id="password"
        placeholder="Enter your password"
        required
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Submit -->
    <button
      type="submit"
      [disabled]="loading || !loginForm.form.valid"
      class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50"
    >
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <!-- Error message -->
    <div *ngIf="error" class="mt-4 text-red-600 text-sm text-center">
      {{ error }}
    </div>
  </form>
</div>
