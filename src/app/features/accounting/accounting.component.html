<app-navbar></app-navbar>

<div class="max-w-4xl mx-auto mt-10 space-y-8"  *ngIf="!loading">
  <!-- 🧾 Add Transaction -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h2 class="text-xl font-bold mb-4 text-blue-600">เพิ่มรายการบัญชี</h2>

    <form (ngSubmit)="addTransaction()" class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium">หมวดหมู่</label>
        <select
          [(ngModel)]="selectedCategoryId"
          name="categoryId"
          aria-label="เลือกหมวดหมู่"
          class="w-full border px-4 py-2 rounded"
        >
          <optgroup label="รายรับ">
            <option *ngFor="let c of incomeCategories" [value]="c.id">
              {{ c.name }}
            </option>
          </optgroup>

          <optgroup label="รายจ่าย">
            <option *ngFor="let c of expenseCategories" [value]="c.id">
              {{ c.name }}
            </option>
          </optgroup>
        </select>
      </div>

      <div>
        <label for="transaction-amount" class="block text-sm font-medium"
          >จำนวนเงิน</label
        >
        <input
          type="number"
          [(ngModel)]="amount"
          name="amount"
          id="transaction-amount"
          aria-label="จำนวนเงิน"
          placeholder="0.00"
          class="w-full border px-4 py-2 rounded"
          required
        />
      </div>

      <div>
        <label for="transaction-date" class="block text-sm font-medium"
          >วันที่</label
        >
        <input
          type="date"
          [(ngModel)]="date"
          name="date"
          id="transaction-date"
          aria-label="วันที่"
          class="w-full border px-4 py-2 rounded"
        />
      </div>

      <div>
        <label for="transaction-note" class="block text-sm font-medium"
          >หมายเหตุ</label
        >
        <textarea
          [(ngModel)]="note"
          name="note"
          id="transaction-note"
          rows="2"
          placeholder="กรอกหมายเหตุ"
          aria-label="หมายเหตุ"
          class="w-full border px-4 py-2 rounded"
        ></textarea>
      </div>

      <div class="md:col-span-2 text-right">
        <button
          type="submit"
          class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700"
        >
          ➕ บันทึกรายการ
        </button>
      </div>
    </form>
  </div>

  <!-- 🎯 Goal -->
  <div class="bg-gray-100 p-4 rounded">
    <p class="font-medium mb-1">🎯 เป้าหมาย: {{ goal.goalName }}</p>
    <div class="w-full h-3 bg-gray-300 rounded">
      <div
        class="h-3 bg-green-500 rounded"
        [style.width.%]="getGoalProgress()"
      ></div>
    </div>
    <!-- <p class="text-sm text-gray-600 mt-1">
      {{ goal.currentAmount | currency : "THB" }} /
      {{ goal.amountTarget | currency : "THB" }} (ก่อน
      {{ goal.dueDate | date : "longDate" }})
    </p> -->
    <p class="text-sm text-gray-600 mt-1">
      {{ advice }}
  </div>

  <!-- 📄 History Table -->
  <div class="bg-white p-4 rounded-xl shadow">
    <h3 class="text-lg font-semibold text-gray-700 mb-3">📄 รายการย้อนหลัง</h3>
    <table class="w-full table-auto text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-2 py-1 text-left">วันที่</th>
          <th class="px-2 py-1 text-left">หมวดหมู่</th>
          <th class="px-2 py-1 text-right">จำนวน</th>
          <th class="px-2 py-1 text-left">หมายเหตุ</th>
          <th class="px-2 py-1 text-center">🗑️</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of transactions" class="border-b">
          <td class="px-2 py-1">{{ t.date | date : "shortDate" }}</td>
          <td class="px-2 py-1">{{ getCategoryName(t.categoryId) }}</td>
          <td
            class="px-2 py-1 text-right"
            [ngClass]="{
              'text-green-600': isIncome(t),
              'text-red-600': !isIncome(t)
            }"
          >
            {{ t.amount | currency : "THB" }}
          </td>
          <td class="px-2 py-1">{{ t.note }}</td>
          <td class="px-2 py-1 text-center">
            <button
              (click)="deleteTransaction(t.id)"
              class="text-red-500 hover:underline"
            >
              ลบ
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
